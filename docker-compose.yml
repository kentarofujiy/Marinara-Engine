# ──────────────────────────────────────────────
# Marinara Engine — Docker Compose
# ──────────────────────────────────────────────
services:
  marinara:
    # Build from the local working tree. To use the published image instead,
    # comment out `build:` and restore:
    #   image: ghcr.io/pasta-devs/marinara-engine:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_BRANCH: ${BUILD_BRANCH:-}
    image: ghcr.io/pasta-devs/marinara-engine:staging
    init: true
    ports:
      - "127.0.0.1:${PORT:-7861}:7860"
    volumes:
      - marinara-latest-data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - FILE_STORAGE_DIR=/app/data/storage
      - MARINARA_DOCKER=true
      - AUTO_CREATE_DEFAULT_CONNECTION=${AUTO_CREATE_DEFAULT_CONNECTION:-true}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      # Set BASIC_AUTH_USER/BASIC_AUTH_PASS and ADMIN_SECRET before exposing beyond localhost.
      # - TZ=America/New_York          # IANA timezone for time-based features (e.g. character schedules)
      # - ENCRYPTION_KEY=              # AES key for API key encryption (generate: openssl rand -hex 32)
      # - LOG_LEVEL=debug              # Set to "debug" to log full prompts & responses
      - LOG_LEVEL=debug              # Set to "debug" to log full prompts & responses
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - ENABLE_EXTERNAL_EXTENSIONS=true
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - IP_ALLOWLIST_ENABLED=false
      - MARINARA_REQUIRE_ADMIN_SECRET_ON_LOOPBACK=true
      - UPDATES_APPLY_ENABLED=true
      - UPDATES_ALLOW_REMOTE_APPLY=true
      - SIDECAR_RUNTIME_INSTALL_ENABLED=true
      - CUSTOM_TOOL_SCRIPT_ENABLED=true
      - PROVIDER_LOCAL_URLS_ENABLED=true
      - IMAGE_LOCAL_URLS_ENABLED=true
      - TTS_LOCAL_URLS_ENABLED=true
    restart: unless-stopped

volumes:
  marinara-latest-data:
